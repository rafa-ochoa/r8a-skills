      <stop offset="0%" stop-color="#a786ff"/><stop offset="50%" stop-color="#f692c8"/><stop offset="100%" stop-color="#65dfd6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ae6bed" stop-opacity=".27"/><stop offset="100%" stop-color="#ae6bed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1070" cy="90" r="345" fill="url(#glow)"/>
  <circle cx="155" cy="530" r="260" fill="url(#glow)" opacity=".35"/>
