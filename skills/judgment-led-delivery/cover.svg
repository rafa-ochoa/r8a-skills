<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title description">
  <title id="title">Judgment-led delivery: decide, build, refine, verify</title>
  <desc id="description">A four-step product engineering loop. Decide what matters, build a working slice, refine the experience, and verify review readiness. AI accelerates implementation; human judgment guides the outcome.</desc>
